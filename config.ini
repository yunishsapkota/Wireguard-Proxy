# ─────────────────────────────────────────────────────────────────────────────
# config.ini — WireGuard CGNAT Relay (no-auth test version)
# ─────────────────────────────────────────────────────────────────────────────

# ── VPS (vps_relay.py) ────────────────────────────────────────────────────────
[relay]

# UDP port the home server registers on.
# Must be open inbound (UDP) in your AWS Security Group.
ctrl_port = 51821

# UDP port that external WireGuard peers connect to.
# Must be open inbound (UDP) in your AWS Security Group.
wg_port = 51820

# Bind address (leave as 0.0.0.0 unless you need a specific interface)
bind_addr = 0.0.0.0


# ── Home server (home_client.py) ──────────────────────────────────────────────
[client]

# Public IP (or hostname) of your VPS — CHANGE THIS
vps_ip = 1.2.3.4

# Must match relay.ctrl_port above
ctrl_port = 51821

# Port your local WireGuard daemon listens on
wg_local_port = 51820

# Local port for the tunnel socket (0 = OS picks, recommended for testing)
local_bind_port = 0
