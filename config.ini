# ─────────────────────────────────────────────────────────────────────────────
# config.ini — WireGuard CGNAT Relay (no-auth test version)
# ─────────────────────────────────────────────────────────────────────────────

# ── VPS (vps_relay.py) ────────────────────────────────────────────────────────
[relay]

# Single UDP port for everything:
#   • WireGuard peers connect here
#   • Home server registers / sends keepalives here
#   • Control packets are identified by their 0xDEADBEEF magic prefix
#     (WireGuard message types 1-4 start with 0x01-0x04, never 0xDE)
# Must be open inbound (UDP) in your AWS Security Group.
wg_port = 51820

# Bind address (leave as 0.0.0.0 unless you need a specific interface)
bind_addr = 0.0.0.0


# ── Home server (home_client.py) ──────────────────────────────────────────────
[client]

# Public IP (or hostname) of your VPS — CHANGE THIS
vps_ip = 1.2.3.4

# Must match relay.wg_port above
wg_port = 51820

# Port your local WireGuard daemon listens on (default 51820)
wg_local_port = 51820

# Local port for the tunnel socket (0 = OS picks, recommended)
local_bind_port = 0
